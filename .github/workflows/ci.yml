name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch for matching parity tests
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[eval,test]'
      - run: pytest
      - run: python -m unittest discover -s evaluation/tests -v
      - run: (cd data/splits/navi && sha256sum -c SHA256SUMS)
      - run: sha256sum -c data/splits/navi/estimation/SHA256SUMS
      - name: Reject machine-specific paths
        run: |
          if git grep -nE '/home/[^/]+/|/Users/[^/]+/|/data[0-9]+/' -- \
              ':!third_party' ':!.github/workflows/ci.yml'; then
            echo 'Machine-specific path found in tracked project files.' >&2
            exit 1
          fi

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update
      - run: sudo apt-get install -y ninja-build libeigen3-dev libopencv-dev
      - run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
