# Paths are resolved relative to this file. The expected layout is:
# <matching_result_root>/<dataset>/<method>/matching_<index>.csv
# <matching_result_root>/<dataset>/pose_intrinsics.csv
matching_result_root=../../artifacts/matching_estimation_results/NAVI_wild
# Separate multiple subset names with commas.
datasets=wildset_0-40
method=combined_interpolate_v3/layer19/debias_svd200/progressive_k5_GMSm2m_ThrFact_4.0_Gridsz_20_auto_mask

ransac_mode=HCM_MC
top_n_candidates=100
q_ub=0.3
m2m_delta=0.01

max_error_px=1.0
similarity_threshold=0.0
max_matching_num=1024
# Optional controlled proposal source. Zero preserves historical behavior.
# A positive value requires a k_first (or legacy k) CSV column, fixed
# min=max iterations, max_matching_num=0, and similarity_threshold=0. Only
# minimal sampling is filtered; scoring/refinement still use the full graph.
proposal_max_k=0
min_iterations=1000
max_iterations=100000
success_prob=0.9999
seed=0
tangent_sampson=false
init_with_gt=false
write_gt_hypothesis_probe=false
skip_existing_pairs=true
allow_unbound_pose=false

ransac_times=1
output_csv=loransac_results.csv
