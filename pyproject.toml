[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-m2m"
version = "0.1.0"
description = "Many-to-many association and robust estimation with DINOv2/v3 features"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
vision = [
  "ftfy>=6.1",
  "omegaconf>=2.3",
  "opencv-python>=4.8",
  "regex>=2023.0",
  "scikit-learn>=1.3",
  "submitit>=1.5",
  "termcolor>=2.3",
  "torch==2.7.1",
  "torchmetrics>=1.2",
  "torchvision==0.22.1",
]
test = ["pytest>=7.4"]
eval = [
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
dino-m2m = "dino_m2m.cli:main"

[tool.setuptools]
packages = [
  "dino_m2m",
  "evaluation",
  "evaluation.dense_correspondence",
  "evaluation.estimation",
  "evaluation.visualization",
]
package-dir = {dino_m2m = "src/dino_m2m", evaluation = "evaluation"}

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
