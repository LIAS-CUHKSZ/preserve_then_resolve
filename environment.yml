name: dino-m2m
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pillow>=9.5
  - pyyaml>=6.0
  - tqdm>=4.65
  - opencv>=4.8
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib>=3.7
  # Runtime imports used by the pinned DINOv3 hub package.
  - ftfy>=6.1
  - omegaconf>=2.3
  - regex
  - scikit-learn>=1.3
  - submitit>=1.5
  - termcolor>=2.3
  - torchmetrics>=1.2
  - pytest>=7.4
  - cmake>=3.20
  - ninja
  # Development headers required by PoseLib and the C++ estimator.
  - eigen>=3.4
  # DINOv3's officially tested PyTorch versions. Pick a CUDA-enabled or CPU
  # build through Conda channel configuration for the target machine.
  - pytorch=2.7.1
  - torchvision=0.22.1
  - pip
  - pip:
      - -e .
